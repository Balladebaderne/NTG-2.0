services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_AUTH_API_URL=http://localhost:5001

  login-service:
    build: ./Services/loginService
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - CORS_ORIGIN=http://localhost:3000
      - JWT_SECRET=local-login-secret-change-me
      - JWT_EXPIRES_IN=1h

  gateway:
    build: ./gateway
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    depends_on:
      - service-template

  service-template:
    build: ./Services/service-template
    environment:
      - PORT=5000
      - DATABASE_URL=postgres://postgres:postgres@service_template_db:5432/service_template_db
    depends_on:
      - service_template_db

  service_template_db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=service_template_db
    ports:
      - "5433:5432"
    volumes:
      - service_template_db_data:/var/lib/postgresql/data

volumes:
  service_template_db_data:
