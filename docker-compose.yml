version: '3.8'
services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8080

  gateway:
    build: ./gateway
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    depends_on:
      - service-template
      - shipments-service

  service-template:
    build: ./Services/service-template
    environment:
      - PORT=5000
      - DATABASE_URL=postgres://postgres:postgres@service_template_db:5432/service_template_db
    depends_on:
      - service_template_db

  service_template_db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=service_template_db
    ports:
      - "5433:5432"
    volumes:
      - service_template_db_data:/var/lib/postgresql/data

  shipments-service:
    build: ./Services/shipmentsService
    ports:
      - "5001:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://shipments_db:27017/shipments_db
    depends_on:
      - shipments_db

  shipments_db:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - shipments_db_data:/data/db

  sender-service:
    build: ./Services/senderService
    ports:
      - "5006:5003"
    environment:
      - PORT=5003
      - MONGODB_URI=mongodb://sender_db:27017/sender_db
      - SHIPMENTS_URL=http://shipments-service:5000
    depends_on:
      - sender_db
      - shipments-service

  sender_db:
    image: mongo:7
    ports:
      - "27020:27017"
    volumes:
      - sender_db_data:/data/db

volumes:
  service_template_db_data:
  shipments_db_data:
  sender_db_data:
