services:
  traefik:
    image: traefik:v3.0
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    ports:
      - "80:80"       # HTTP entrypoint — all API traffic
      - "8080:8080"   # Dashboard (dev only)
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./traefik/traefik.yml:/etc/traefik/traefik.yml:ro"

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost

  shipments-service:
    build: ./Services/shipmentsService
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://shipments_db:27017/shipments_db
    depends_on:
      - shipments_db
    labels:
      - "traefik.enable=true"
      # Route /shipments (and nested /shipments/:id/goods, etc.) to this service
      - "traefik.http.routers.shipments.rule=PathPrefix(`/shipments`)"
      - "traefik.http.routers.shipments.entrypoints=web"
      - "traefik.http.services.shipments.loadbalancer.server.port=5000"

  shipments_db:
    image: mongo:7
    ports:
      - "27018:27017"
    volumes:
      - shipments_db_data:/data/db
      - ./Services/shipmentsService/Database/init:/docker-entrypoint-initdb.d

volumes:
  shipments_db_data:
