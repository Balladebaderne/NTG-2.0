networks:
  web:
    name: ntg_web       # Public-facing: Traefik + routed services
    driver: bridge
  internal:
    name: ntg_internal  # Private: databases only — no internet access
    driver: bridge
    internal: true
  broker:
    name: ntg_broker    # Broker network: RabbitMQ + message-broker service
    driver: bridge
    internal: true

services:
  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "15672:15672"   # Management UI (dev only)
    networks:
      - broker          # AMQP traffic stays internal
      - web             # Needed for host port binding on Docker Desktop
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  message-broker:
    build: ./messageBroker
    environment:
      - PORT=3000
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASS=guest
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - broker
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10


  traefik:
    image: traefik:v3.6.2
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    ports:
      - "80:80"       # HTTP entrypoint — all API traffic
      - "9090:8080"   # Dashboard (dev only)
    networks:
      - web
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./traefik/traefik.yml:/etc/traefik/traefik.yml:ro"

  frontend:
    build: ./frontend
    networks:
      - web             # Only public network — cannot reach databases
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
      - "traefik.docker.network=ntg_web"

  login-service:
    build: ./Services/loginService
    environment:
      - PORT=5001
      - CORS_ORIGIN=http://localhost
      - JWT_SECRET=local-login-secret-change-me
      - JWT_EXPIRES_IN=1h
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth.rule=PathPrefix(`/auth`)"
      - "traefik.http.routers.auth.entrypoints=web"
      - "traefik.http.routers.auth.priority=100"
      - "traefik.http.services.auth.loadbalancer.server.port=5001"
      - "traefik.docker.network=ntg_web"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10

  shipments-service:
    build: ./Services/shipmentsService
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://shipments_db:27017/shipments_db
      - DRIVER_SERVICE_URL=http://driver-service:5001
      - AUTH_REQUIRED=true
      - JWT_SECRET=local-login-secret-change-me
      - SERVICE_AUTH_TOKEN=local-service-token-change-me
    depends_on:
      - shipments_db
    networks:
      - web             # Traefik routes inbound traffic here
      - internal        # Service reaches shipments_db here
    labels:
      - "traefik.enable=true"
      # Route /shipments (and nested /shipments/:id/goods, etc.) to this service
      - "traefik.http.routers.shipments.rule=PathPrefix(`/shipments`)"
      - "traefik.http.routers.shipments.entrypoints=web"
      - "traefik.http.routers.shipments.priority=10"
      - "traefik.http.services.shipments.loadbalancer.server.port=5000"
      - "traefik.docker.network=ntg_web"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10

  shipments_db:
    image: mongo:7
    networks:
      - internal        # DB only on internal — not reachable from frontend or Traefik
    volumes:
      - shipments_db_data:/data/db
      - ./Services/shipmentsService/Database/init:/docker-entrypoint-initdb.d

  tracking-service:
    build: ./Services/trackingService
    environment:
      - PORT=5000
      - DATABASE_URL=postgres://postgres:postgres@tracking_db:5432/tracking_db
      - SHIPMENTS_SERVICE_URL=http://shipments-service:5000
      - NOTIFICATION_SERVICE_URL=http://notification-service:5002
      - VERIFY_SHIPMENTS=true
      - SHIPMENT_STATUS_SYNC_ENABLED=true
      - HTTP_TIMEOUT_SECONDS=3
      - TRACKING_EVENT_PUBLISHING_ENABLED=true
      - TRACKING_EVENTS_EXCHANGE=tracking.events
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASS=guest
      - AUTH_REQUIRED=true
      - JWT_SECRET=local-login-secret-change-me
      - SERVICE_AUTH_TOKEN=local-service-token-change-me
    depends_on:
      tracking_db:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    networks:
      - web
      - internal
      - broker
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tracking.rule=PathPrefix(`/tracking`)"
      - "traefik.http.routers.tracking.entrypoints=web"
      - "traefik.http.routers.tracking.priority=10"
      - "traefik.http.services.tracking.loadbalancer.server.port=5000"
      - "traefik.docker.network=ntg_web"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10

  tracking_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tracking_db
    networks:
      - internal
    volumes:
      - tracking_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tracking_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  route-service:
    build: ./Services/routeService
    environment:
      - PORT=5000
      - DATABASE_URL=postgres://postgres:postgres@route_db:5432/route_db
      - SHIPMENTS_SERVICE_URL=http://shipments-service:5000
      - VERIFY_SHIPMENTS=true
      - SHIPMENT_ROUTE_SYNC_ENABLED=true
      - HTTP_TIMEOUT_SECONDS=3
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-AIzaSyCfVQgCV8rQjV4EjnkevYoae4hFjyZ4SL0}
      - ROUTE_CALCULATION_PROVIDER=template
      - ROUTE_CALCULATION_REQUIRED=false
      - AUTH_REQUIRED=true
      - JWT_SECRET=local-login-secret-change-me
      - SERVICE_AUTH_TOKEN=local-service-token-change-me
    depends_on:
      route_db:
        condition: service_healthy
      shipments-service:
        condition: service_healthy
    networks:
      - web
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.routes.rule=PathPrefix(`/routes`)"
      - "traefik.http.routers.routes.entrypoints=web"
      - "traefik.http.routers.routes.priority=10"
      - "traefik.http.services.routes.loadbalancer.server.port=5000"
      - "traefik.docker.network=ntg_web"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10

  route_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: route_db
    networks:
      - internal
    volumes:
      - route_db_data:/var/lib/postgresql/data
      - ./Services/routeService/Database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d route_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  driver-service:
    build: ./Services/driverService
    environment:
      - PORT=5001
      - DATABASE_URL=postgres://postgres:postgres@driver_db:5432/driver_db
      - AUTH_REQUIRED=true
      - JWT_SECRET=local-login-secret-change-me
      - SERVICE_AUTH_TOKEN=local-service-token-change-me
    depends_on:
      driver_db:
        condition: service_healthy
    networks:
      - web
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.drivers.rule=PathPrefix(`/drivers`)"
      - "traefik.http.routers.drivers.entrypoints=web"
      - "traefik.http.routers.drivers.priority=10"
      - "traefik.http.services.drivers.loadbalancer.server.port=5001"
      - "traefik.docker.network=ntg_web"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10

  driver_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: driver_db
    networks:
      - internal
    volumes:
      - driver_db_data:/var/lib/postgresql/data
      - ./Services/driverService/Database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d driver_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  driver-loyalty-service:
    build: ./Services/driverLoyaltyService/src
    environment:
      - PORT=5003
      - DATABASE_URL=postgres://postgres:postgres@loyalty_db:5432/loyalty_db
      - JWT_SECRET=local-login-secret-change-me
      - LOYALTY_EVENT_CONSUMER_ENABLED=true
      - TRACKING_EVENTS_EXCHANGE=tracking.events
      - LOYALTY_EVENTS_QUEUE=driver-loyalty.tracking-events
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASS=guest
    depends_on:
      loyalty_db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - web
      - internal
      - broker
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.loyalty.rule=PathRegexp(`^/drivers/[^/]+/points$`)"
      - "traefik.http.routers.loyalty.entrypoints=web"
      - "traefik.http.routers.loyalty.priority=200"
      - "traefik.http.services.loyalty.loadbalancer.server.port=5003"
      - "traefik.docker.network=ntg_web"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10

  loyalty_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: loyalty_db
    networks:
      - internal
    volumes:
      - loyalty_db_data:/var/lib/postgresql/data
      - ./Services/driverLoyaltyService/Database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d loyalty_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  notification-service:
    build: ./Services/notificationService
    environment:
      - PORT=5002
      - DATABASE_URL=postgres://postgres:postgres@notification_db:5432/notification_db
      - SHIPMENTS_SERVICE_URL=http://shipments-service:5000
      - DELAY_POLLING_ENABLED=true
      - DELAY_POLLING_INTERVAL_MS=60000
      - AUTH_REQUIRED=true
      - JWT_SECRET=local-login-secret-change-me
      - SERVICE_AUTH_TOKEN=local-service-token-change-me
    depends_on:
      - notification_db
      - shipments-service
    networks:
      - web
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.notifications.rule=PathPrefix(`/notifications`)"
      - "traefik.http.routers.notifications.entrypoints=web"
      - "traefik.http.routers.notifications.priority=10"
      - "traefik.http.services.notifications.loadbalancer.server.port=5002"
      - "traefik.docker.network=ntg_web"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10

  notification_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notification_db
    networks:
      - internal
    volumes:
      - notification_db_data:/var/lib/postgresql/data
      - ./Services/notificationService/Database/init:/docker-entrypoint-initdb.d

  sender-service:
    build: ./Services/senderService
    ports:
      - "5006:5003" # Dev-only convenience; Traefik is the primary access path.
    environment:
      - PORT=5003
      - MONGODB_URI=mongodb://sender_db:27017/sender_db
      - SHIPMENTS_SERVICE_URL=http://shipments-service:5000
      - SHIPMENTS_URL=http://shipments-service:5000
    depends_on:
      - sender_db
      - shipments-service
    networks:
      - web
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.senders.rule=PathPrefix(`/senders`)"
      - "traefik.http.routers.senders.entrypoints=web"
      - "traefik.http.routers.senders.priority=10"
      - "traefik.http.services.senders.loadbalancer.server.port=5003"
      - "traefik.docker.network=ntg_web"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10

  sender_db:
    image: mongo:7
    ports:
      - "27020:27017" # Dev-only convenience.
    networks:
      - internal
    volumes:
      - sender_db_data:/data/db

  ai-chat-service:
    build: ./Services/aiChatService
    ports:
      - "5007:5004" # Dev-only convenience; Traefik is the primary access path.
    environment:
      - PORT=5004
      - MONGODB_URI=mongodb://ai_chat_db:27017/ai_chat_db
      - SHIPMENTS_SERVICE_URL=http://shipments-service:5000
      - SHIPMENTS_URL=http://shipments-service:5000
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    depends_on:
      - ai_chat_db
      - shipments-service
    networks:
      - web
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.chat.rule=PathPrefix(`/chat`) || PathPrefix(`/conversations`)"
      - "traefik.http.routers.chat.entrypoints=web"
      - "traefik.http.routers.chat.priority=10"
      - "traefik.http.services.chat.loadbalancer.server.port=5004"
      - "traefik.docker.network=ntg_web"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5004/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10

  ai_chat_db:
    image: mongo:7
    ports:
      - "27021:27017" # Dev-only convenience.
    networks:
      - internal
    volumes:
      - ai_chat_db_data:/data/db

  customer-service:
    build: ./Services/customerService
    environment:
      - PORT=5001
      - MONGODB_URI=mongodb://customer_db:27017/customer_db
      - SHIPMENTS_SERVICE_URL=http://shipments-service:5000
    depends_on:
      - customer_db
      - shipments-service
    networks:
      - web
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.customers.rule=PathPrefix(`/customers`)"
      - "traefik.http.routers.customers.entrypoints=web"
      - "traefik.http.routers.customers.priority=10"
      - "traefik.http.services.customers.loadbalancer.server.port=5001"
      - "traefik.docker.network=ntg_web"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10

  customer_db:
    image: mongo:7
    networks:
      - internal
    volumes:
      - customer_db_data:/data/db

  customer-support-service:
    build: ./Services/customerSupportService
    environment:
      - PORT=5002
      - MONGODB_URI=mongodb://customer_support_db:27017/customer_support_db
      - SHIPMENTS_SERVICE_URL=http://shipments-service:5000
      - AUTH_REQUIRED=true
      - JWT_SECRET=local-login-secret-change-me
      - SERVICE_AUTH_TOKEN=local-service-token-change-me
    depends_on:
      - customer_support_db
      - shipments-service
    networks:
      - web
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tickets.rule=PathPrefix(`/tickets`) || PathPrefix(`/search`)"
      - "traefik.http.routers.tickets.entrypoints=web"
      - "traefik.http.routers.tickets.priority=10"
      - "traefik.http.services.tickets.loadbalancer.server.port=5002"
      - "traefik.docker.network=ntg_web"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10

  customer_support_db:
    image: mongo:7
    networks:
      - internal
    volumes:
      - customer_support_db_data:/data/db

volumes:
  shipments_db_data:
  tracking_db_data:
  route_db_data:
  driver_db_data:
  loyalty_db_data:
  notification_db_data:
  sender_db_data:
  ai_chat_db_data:
  customer_db_data:
  customer_support_db_data:
  rabbitmq_data:
